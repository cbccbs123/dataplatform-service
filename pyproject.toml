[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dataflatform-service"
version = "0.1.0"
description = "멀티모달 데이터 통합 플랫폼 — 백엔드 API(검색·자산 상세·다운로드·관리자 관계 검토 serving)"
requires-python = ">=3.11"
dependencies = [
    # ⚠️ 코어(src.*)는 여기 핀하지 않는다 — README §6 대로 별도 설치:
    #   설치형: pip install "meta-extract @ git+https://github.com/OWNER/dataplatform-core.git@<tag>"
    #   참조형: pip install -e /path/to/dataplatform-core
    # (PyPI 미배포라 이름 핀 시 설치 실패·두 방식 유연성 위해 제외.)
    # 코어가 **전이 제공**하는 것(psycopg·opensearch-py 등)은 여기 안 적는다.
    # 반대로 코어에 **없는** 백엔드 직접 의존은 반드시 명시(078 AST 스캔에서 opencv·PyJWT 누락 발견·보강):
    "fastapi>=0.115.0",       # service/api/* (ASGI 앱)
    "uvicorn>=0.30.0",        # ASGI 서버(실행 진입 uvicorn service.api:app)
    "python-dotenv>=1.0.1",   # service/bootstrap.py (.env 로드)
    "opencv-python>=4.9.0",   # service/portal/thumbnail.py (cv2 — 코어 미제공)
    "PyJWT>=2.8.0",           # service/portal/auth/* (jwt — 코어 미제공·현재 목록에 없던 구멍)
    "pydantic>=2.7.0",        # service/api/* (요청/응답 모델 — fastapi 전이지만 직접 import 라 명시)
]

[tool.setuptools.packages.find]
where = ["."]
include = ["service*"]

[tool.ruff]
line-length = 100
lint.ignore = ["E501"]  # 코어 레포 관례와 동일(한국어 주석 다수·E501 무시)

[tool.ruff.lint.isort]
known-first-party = ["service", "src"]  # 코어(src)·백엔드(service) 모두 first-party 정렬
